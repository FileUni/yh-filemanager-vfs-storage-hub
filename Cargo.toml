[package]
name = "yh-filemanager-vfs-storage-hub"
version = "0.1.10"
edition = "2024"
description = "VFS Storage Hub based on OpenDAL for FileUni"

[dependencies]
argon2 = "0.5.3"
password-hash = "0.5.0"
# OpenDAL
opendal = { version = "0.55.0", default-features = false, features = [
    "executors-tokio",
    "services-fs",
    "services-s3",
    "services-webdav",
    "services-dropbox",
    "services-onedrive",
    "services-gdrive",
    "services-memory"
] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"] }

# Core dependencies
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
chrono = { version = "0.4.43", features = ["serde"] }
thiserror = "2.0.18"
anyhow = "1.0.100"
futures = "0.3.31"
bytes = { version = "1.11.0", features = ["serde"] }
async-trait = "0.1.88"
once_cell = "1.21.3"
uuid = { version = "1.19.0", features = ["v7", "serde"] }
dashmap = "6.1.0"
base64 = "0.22.1"
sha2 = "0.10.9"
aes = "0.8.4"
ctr = "0.9.2"
hex = "0.4.3"
rand = "0.8"
rayon = "1.11.0"
hmac = "0.12.1"
hkdf = "0.12.4"
percent-encoding = "2.3.1"
tokio-util = { version = "0.7.13", features = ["io"] }
yh-rust-crypto = { path = "../yh-rust-crypto" }
mime_guess = "2.0.5"
image = { version = "0.25.9", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
kamadak-exif = "0.6.1"
resvg = { version = "0.45.0", default-features = true }

# Compression and decompression native support
flate2 = { version = "1.1", features = ["rust_backend"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate", "aes-crypto"] }
tar = "0.4"

# Internal modules
yh-license = { path = "../yh-license" }
yh-config-infra = { path = "../yh-config-infra" }
yh-console-log = { path = "../yh-console-log" }
yh-database = { path = "../yh-database" }
yh-fast-kv-storage-hub = { path = "../yh-fast-kv-storage-hub" }
yh-external-process-manager = { path = "../yh-external-process-manager" }
sea-orm = { version = "1.1.19", features = ["runtime-tokio", "sqlx-postgres", "sqlx-sqlite", "macros", "with-chrono"] }

# OpenAPI
utoipa = { version = "5.4.0", features = ["chrono", "uuid"] }

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21.1"
ndk-context = "0.1.1"

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = { version = "0.6.2", default-features = false, features = ["std"] }
objc2-foundation = "0.3.2"
objc2-av-foundation = { version = "0.3.2", features = ["AVAsset", "AVAssetImageGenerator", "objc2-core-graphics", "objc2-core-media"] }
objc2-core-foundation = { version = "0.3.2", features = ["CFCGTypes"] }
objc2-core-graphics = { version = "0.3.2", features = ["CGImage"] }
objc2-core-media = { version = "0.3.2", features = ["CMTime"] }
objc2-ui-kit = { version = "0.3.2", features = ["UIImage", "objc2-core-foundation"] }
