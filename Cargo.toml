[package]
name = "yh-filemanager-vfs-storage-hub"
version = "0.0.1-alpha8"
edition = "2024"
description = "VFS Storage Hub based on OpenDAL for FileUni"

[dependencies]
argon2 = "0.5.3"
password-hash = "0.5.0"
# OpenDAL
opendal = { version = "0.55.0", default-features = false, features = [
    "executors-tokio",
    "services-fs",
    "services-s3",
    "services-webdav",
    "services-memory"
] }
reqwest = { version = "0.12.24", default-features = false, features = ["rustls-tls-webpki-roots-no-provider"] }

# Core dependencies
tokio = { version = "1.48.0", features = ["rt-multi-thread", "macros", "time", "net", "io-util", "sync", "fs"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
chrono = { version = "0.4.43", features = ["serde"] }
thiserror = "2.0.18"
anyhow = "1.0.100"
futures = "0.3.31"
bytes = { version = "1.11.0", features = ["serde"] }
async-trait = "0.1.88"
once_cell = "1.21.3"
uuid = { version = "1.19.0", features = ["v4", "serde"] }
dashmap = "6.1.0"
base64 = "0.22.1"
sha2 = "0.10.9"
rand = "0.8"
percent-encoding = "2.3.1"
tokio-util = { version = "0.7.13", features = ["io"] }
yh-rust-crypto = { path = "../yh-rust-crypto" }

# Compression and decompression native support
flate2 = { version = "1.1", features = ["rust_backend"] }
zip = { version = "2.4.2", default-features = false, features = ["deflate", "aes-crypto"] }
tar = "0.4"

# Internal modules
yh-config-infra = { path = "../yh-config-infra" }
yh-console-log = { path = "../yh-console-log" }
yh-database = { path = "../yh-database" }
yh-fast-kv-storage-hub = { path = "../yh-fast-kv-storage-hub" }
yh-external-process-manager = { path = "../yh-external-process-manager" }
sea-orm = { version = "1.1.19", features = ["runtime-tokio", "sqlx-postgres", "sqlx-sqlite", "macros", "with-chrono"] }

# OpenAPI
utoipa = { version = "5.4.0", features = ["chrono", "uuid"] }
